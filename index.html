<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intraday Signal</title>
<style>
:root{--bg:#0F1419;--card:#16202B;--line:#243140;--tx:#E8ECF1;--mu:#9AA7B5;--g:#3DDC97;--r:#FF8A80;--a:#FFC857}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px Inter,Arial,sans-serif;padding:20px;max-width:560px;margin:auto}
h1{font-size:18px;margin:0 0 14px}.row{display:flex;gap:8px}
input{flex:1;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:0 14px;font-size:16px}
button{height:48px;padding:0 20px;border:0;border-radius:12px;background:var(--g);color:#0F1419;font-weight:600;font-size:15px}
.sum{background:var(--card);border-radius:16px;padding:14px 16px;margin:14px 0;font-size:20px;font-weight:800}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center}.sym{font-weight:600}
.sig{font-size:44px;font-weight:800;line-height:1.1;margin:6px 0}.BUY{color:var(--g)}.SELL{color:var(--r)}.WAIT{color:var(--a)}
.mu{color:var(--mu);font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--bg);border-radius:8px;padding:6px 9px;font-size:12px}.ok{color:var(--g)}.no{color:var(--r)}
.pill{font-size:12px;font-weight:600;border-radius:20px;padding:4px 10px}.pp{background:var(--g);color:#0F1419}.pf{border:1px solid var(--r);color:var(--r)}
</style></head><body>
<h1>Intraday Signal <span class="mu" id="st"></span></h1>
<div class="row"><input id="q" aria-label="Company names" placeholder="Reliance, TCS, Infosys" value="Reliance"><button onclick="run()">Check</button></div>
<div id="out"></div>
<p class="mu">Decision aid only, not financial advice. Updates every 30 seconds.</p>
<script>
let timer;
async function run(){
  const names=document.getElementById('q').value;
  const out=document.getElementById('out');
  try{
    const r=await fetch('/api/check?names='+encodeURIComponent(names));
    if(r.status==401){out.innerHTML='<div class="card">Not logged in to Upstox. <a style="color:var(--g)" href="/login">Login with Upstox</a></div>';return}
    const d=await r.json();
    const good=d.filter(x=>x.all_pass).length;
    let h='<div class="sum">'+good+' of '+d.length+' meet all criteria</div>';
    d.forEach(x=>{
      if(x.error){h+='<div class="card"><div class="sym">'+esc(x.symbol||x.query)+'</div><div class="mu">'+esc(x.error)+'</div></div>';return}
      const f=Object.values(x.checks).filter(v=>!v).length;
      h+='<div class="card"><div class="top"><div class="sym">'+x.symbol+' · NSE</div>'+(f?'<span class="pill pf">Fails '+f+'</span>':'<span class="pill pp">Meets all 5</span>')+'</div>'
       +'<div class="sig '+x.signal+'">'+x.signal+'</div><div>'+x.why+'</div>'
       +'<div class="mu" style="margin-top:8px">LTP '+x.ltp+' · VWAP '+x.vwap+' · EMA10 '+x.ema10+'<br>Volume '+x.vol_mult+'x · RVOL '+x.rvol+' · Spread '+x.spread+'%</div><div class="chips">'
       +Object.entries(x.checks).map(([k,v])=>'<span class="chip '+(v?'ok':'no')+'">'+(v?'✓ ':'✗ ')+k+'</span>').join('')+'</div></div>';
    });
    out.innerHTML=h;
    document.getElementById('st').textContent='· '+new Date().toLocaleTimeString();
  }catch(e){out.innerHTML='<div class="card">Could not load data.</div>'}
  clearTimeout(timer);timer=setTimeout(run,30000);
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
</script></body></html>
